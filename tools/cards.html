<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0b0b0d; --cream:#f2ebdd; --cream2:#dcd4c4; --dim:#a8a296; --lime:#c8f135; }
  * { box-sizing: border-box; margin: 0; }
  body { background: transparent; }
  .card { position: relative; overflow: hidden; background: var(--ink); color: var(--cream); font-family: Inter, sans-serif; }
  .card canvas { position: absolute; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(200,241,53,.1), transparent 65%); }
  .name { font: 800 92px/0.92 Syne, sans-serif; letter-spacing: -0.05em; }
  .name span { color: var(--lime); }
  .role { font: 600 30px/1.2 Syne, sans-serif; color: var(--cream2); letter-spacing: -0.02em; }
  .role b { color: var(--lime); font-weight: 600; }
  .meta { font: 500 19px/1.4 "JetBrains Mono", monospace; color: var(--dim); letter-spacing: .04em; }
  .url { display: inline-flex; align-items: center; gap: 12px; font: 600 22px/1 Inter, sans-serif; color: var(--ink); background: var(--lime); padding: 14px 22px; border-radius: 99px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); display: inline-block; }
  .chip { display: inline-flex; align-items: center; gap: 10px; font: 500 18px/1 Inter, sans-serif; color: var(--cream2); border: 1px solid rgba(242,235,221,.25); padding: 10px 16px; border-radius: 99px; }

  /* favicon */
  .fav { width: 512px; height: 512px; border-radius: 112px; display: grid; place-items: center; }
  .fav b { font: 800 330px/1 Syne, sans-serif; letter-spacing: -0.06em; color: var(--cream); transform: translate(-10px, -12px); }
  .fav i { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: var(--lime); right: 92px; bottom: 120px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../assets/js/portrait-data.js"></script>
<script>
const card = new URLSearchParams(location.search).get("card") || "og";
const root = document.getElementById("root");

// The same halftone dot grid as the site's hero (assets/js/portrait.js):
// dot size and brightness follow the tone, with a slight turn to show depth.
function drawPortrait(canvas, opts) {
  const ctx = canvas.getContext("2d");
  const { cx, cy, scale, rot = 0.14 } = opts;
  const P = PORTRAIT;
  const bytesOf = (str) => {
    const bin = atob(str), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  };
  const tone = bytesOf(P.tone), depth = bytesOf(P.depth);
  const pitch = P.step * scale;
  const c = Math.cos(rot), s = Math.sin(rot);
  ctx.globalCompositeOperation = "lighter";
  let i = 0;
  for (let r = 0; r < P.rows; r++) {
    for (let col = 0; col < P.cols; col++) {
      const t = tone[r * P.cols + col];
      if (!t) continue;
      const b = t / 255;
      const x = P.x0 + col * P.step, y = P.y0 - r * P.step, z = (depth[i++] / 255) * P.zmax;
      const X = x * c + z * s;
      const persp = 4.2 / (4.2 - (-x * s + z * c));
      const u = cx + X * scale * persp, v = cy - y * scale * persp;
      const rad = 0.3 * pitch * (0.22 + Math.pow(b, 0.7) * 1.35) * persp;
      ctx.fillStyle = `rgba(242,235,221,${(0.12 + Math.pow(b, 1.15) * 0.88) * 0.95})`;
      ctx.beginPath(); ctx.arc(u, v, rad, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function canvasAt(parent, x, y, w, h) {
  const cv = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  Object.assign(cv.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  cv.getContext("2d").scale(dpr, dpr);
  parent.appendChild(cv);
  return cv;
}

async function build() {
  await document.fonts.ready;
  if (card === "og") {
    root.innerHTML = `
      <div class="card" id="c" style="width:1200px;height:630px">
        <div class="glow" style="width:760px;height:760px;right:-170px;top:-60px"></div>
        <div style="position:absolute;left:72px;top:64px;display:grid;gap:24px;width:640px;justify-items:start">
          <span class="chip"><span class="dot"></span>AI &amp; ML Engineer · Hyderabad</span>
          <div class="name">Rishikesh<br>Varma<span>.</span></div>
          <div class="role">Agents that remember.<br>LLMs that run locally.<br><b>Firewalls for AI agents.</b></div>
          <div><span class="url">rishikeshvarma.fun</span></div>
        </div>
      </div>`;
    const c = document.getElementById("c");
    drawPortrait(canvasAt(c, 640, 0, 560, 630), { cx: 300, cy: 384, scale: 322 });
  } else if (card === "banner") {
    root.innerHTML = `
      <div class="card" id="c" style="width:1280px;height:400px;border-radius:24px">
        <div class="glow" style="width:640px;height:640px;right:-60px;top:-120px"></div>
        <div style="position:absolute;left:64px;top:56px;display:grid;gap:20px;width:780px">
          <span class="meta">K. SRI RISHIKESH VARMA · AI &amp; ML ENGINEER</span>
          <div class="name" style="font-size:84px">Hi, I'm Rishikesh<span>.</span></div>
          <div class="role" style="font-size:27px">I build agents that remember, LLMs that run locally,<br>evals that catch the bugs, and <b>firewalls for AI agents.</b></div>
          <div class="meta" style="color:#c8f135">↗ rishikeshvarma.fun</div>
        </div>
      </div>`;
    const c = document.getElementById("c");
    drawPortrait(canvasAt(c, 800, 0, 480, 400), { cx: 290, cy: 300, scale: 258 });
  } else {
    root.innerHTML = `<div class="card fav" id="c"><b>R</b><i></i></div>`;
  }
  document.body.dataset.ready = "1";
}
build();
</script>
</body>
</html>
